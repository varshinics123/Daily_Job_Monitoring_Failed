name: Daily Synapse Failed Jobs Monitor

on:
  workflow_dispatch:

  schedule:
    # Every day at 2:30 PM IST (09:00 UTC)
    - cron: '0 9 * * *'

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Synapse Failed Jobs Monitor
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SYNAPSE_ENDPOINT: ${{ secrets.SYNAPSE_ENDPOINT }}
        run: python Daily_Monitor_Failed_Jobs.py

      - name: Upload failed jobs CSV report
        if: always() && hashFiles('synapse_pipeline_results.csv') != ''
        uses: actions/upload-artifact@v4
        with:
          name: synapse-failed-jobs-report
          path: synapse_pipeline_results.csv
          retention-days: 30
